<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/yyc3-icons/Web%20App/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/yyc3-icons/Web%20App/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/yyc3-icons/Web%20App/favicon-16.png" />
    <link rel="mask-icon" href="/icon.svg" color="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YYC³ AI - 智能代码编辑器与开发环境" />

    <!-- Content Security Policy
         script-src 'unsafe-eval':  WebAssembly (transformers.js) 需要
         style-src 'unsafe-inline': @emotion/react CSS-in-JS 运行时注入需要
         worker-src blob:          Web Worker (transformers.js) 需要
         connect-src:              仅允许已知 AI API 端点，Yjs 协作 WebSocket 使用 wss:
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://open.bigmodel.cn http://localhost:11434 wss:;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      frame-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    "
    />

    <!-- CSRF Token Meta (for server-side rendering) -->
    <meta name="csrf-token" content="" />

    <title>YYC³ AI - 智能开发环境</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
